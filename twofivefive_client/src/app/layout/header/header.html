<header class="border-b mt-4 transition-colors duration-200" [class]="barClass()">
  <nav class="shell flex h-20 items-center justify-between gap-6 md:h-24" aria-label="Principal">
    <a routerLink="/" class="rounded-lg" (click)="closeMenu()">
      <app-logo [label]="siteName" />
    </a>

    <ul
      class="hidden items-center gap-1 rounded-xl border border-line bg-surface/80 p-1 shadow-soft md:flex"
    >
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-brand-50 text-ink-900"
            ariaCurrentWhenActive="page"
            class="block rounded-lg px-4 py-2 text-sm font-medium text-ink-600 transition-colors duration-200 hover:bg-brand-50 hover:text-ink-900"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <a [routerLink]="contact.path" class="btn btn-primary hidden md:inline-flex">
        {{ contact.label }}
      </a>

      <button
        #toggle
        type="button"
        class="inline-flex size-11 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface text-ink-900 md:hidden"
        aria-controls="menu-movil"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="sr-only">Menú</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="size-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
        >
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M4 8h16M4 16h16" />
          }
        </svg>
      </button>
    </div>
  </nav>

  <div
    id="menu-movil"
    class="max-h-[calc(100dvh-5rem)] overflow-y-auto border-t border-line md:hidden"
    [hidden]="!menuOpen()"
  >
    <ul class="shell flex flex-col py-4">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="text-brand-700"
            ariaCurrentWhenActive="page"
            class="block py-3 text-base font-medium text-ink-700"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
      <li class="pt-4">
        <a [routerLink]="contact.path" class="btn btn-primary w-full" (click)="closeMenu()">
          {{ contact.label }}
        </a>
      </li>
    </ul>
  </div>
</header>
