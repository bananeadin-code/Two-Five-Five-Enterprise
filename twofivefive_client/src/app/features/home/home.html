<section class="shell pt-20 pb-28">
  <h1 class="max-w-3xl text-5xl font-semibold tracking-tight text-balance md:text-6xl">
    Tu infraestructura, <span class="emphasis">ligera</span> como una nube.
  </h1>
</section>

@for (section of pendingSections; track section.fragment) {
  <section [id]="section.fragment" class="border-t border-line">
    <div class="shell py-28">
      <h2 class="text-2xl font-semibold tracking-tight">{{ section.label }}</h2>
      <p class="mt-3 text-ink-500">Sección pendiente.</p>
    </div>
  </section>
}
