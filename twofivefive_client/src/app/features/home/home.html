<section class="shell pt-20 pb-28">
  <p class="eyebrow text-brand-600">Parte 1 · Base del sitio</p>
  <h1 class="mt-4 max-w-3xl text-5xl font-semibold tracking-tight text-balance md:text-6xl">
    Tu infraestructura, <span class="emphasis">ligera</span> como una nube.
  </h1>
  <div class="mt-10 flex flex-wrap gap-3">
    <a class="btn btn-primary" href="#">Botón primario</a>
    <a class="btn btn-secondary" href="#">Botón secundario</a>
    <a class="btn btn-dark" href="#">Botón oscuro</a>
  </div>
</section>

@for (section of sections; track section.fragment) {
  <section [id]="section.fragment" class="border-t border-line">
    <div class="shell py-28">
      <p class="eyebrow text-brand-600">{{ section.label }}</p>
      <p class="mt-3 text-ink-500">Sección pendiente.</p>
    </div>
  </section>
}
