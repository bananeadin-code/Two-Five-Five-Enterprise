<div role="img" [attr.aria-label]="preview.description" class="relative mx-auto max-w-lg">
  <img
    src="brand/logo-mark.png"
    alt=""
    width="534"
    height="355"
    class="pointer-events-none ml-auto w-[88%] drop-shadow-[0_24px_40px_rgb(22_99_223/0.25)] select-none"
  />

  <div
    class="relative -mt-12 w-[86%] rounded-xl border border-line bg-surface shadow-soft sm:-mt-16"
  >
    <div class="flex items-center justify-between gap-4 border-b border-line px-5 py-4">
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold">{{ preview.project }}</p>
        <p class="font-mono text-xs text-ink-500">{{ preview.branch }}</p>
      </div>
      <span
        class="shrink-0 rounded-md border border-brand-200 bg-brand-50 px-2 py-0.5 font-mono text-[0.6875rem] text-brand-700"
      >
        {{ preview.status }}
      </span>
    </div>

    <ol class="py-2">
      @for (step of preview.steps; track step.label; let i = $index, last = $last) {
        <li
          class="deploy-step relative flex items-center gap-3 px-5 py-3"
          [style.animation-delay.ms]="stepDelay(i)"
        >
          @if (!last) {
            <span class="absolute top-1/2 left-[1.875rem] h-full w-px bg-brand-200"></span>
          }
          <span
            class="relative grid size-5 shrink-0 place-items-center rounded-[0.3rem] bg-brand-600 text-white"
          >
            <svg
              viewBox="0 0 16 16"
              class="size-3"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3.5 8.5l3 3L12.5 5" />
            </svg>
          </span>
          <span class="text-sm font-medium">{{ step.label }}</span>
          <span class="ml-auto font-mono text-xs text-ink-500">{{ step.detail }}</span>
        </li>
      }
    </ol>

    <p class="border-t border-line px-5 py-3 text-xs text-ink-500">{{ preview.footnote }}</p>
  </div>
</div>
